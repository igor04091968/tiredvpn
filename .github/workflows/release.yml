name: Fork release

on:
  push:
    tags:
      - 'v*-igor.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: github.repository == 'igor04091968/tiredvpn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Test
        run: |
          go test ./internal/strategy
          go test -skip '^(TestWildcardListenersCoexist|TestB1GateCostIsFlatInClientCount)$' ./internal/server
          go vet ./internal/strategy ./internal/server ./cmd/tiredvpn

      - name: Build Linux binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath \
              -ldflags="-s -w -X main.version=$version" \
              -o "tiredvpn-linux-$arch" ./cmd/tiredvpn/
            tar -czf "tiredvpn-linux-$arch.tar.gz" "tiredvpn-linux-$arch"
          done
          sha256sum tiredvpn-linux-amd64.tar.gz tiredvpn-linux-arm64.tar.gz > checksums.txt

      - name: Prepare release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          prerelease: true
          files: |
            tiredvpn-linux-amd64.tar.gz
            tiredvpn-linux-arm64.tar.gz
            checksums.txt

  container:
    if: github.repository == 'igor04091968/tiredvpn'
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v7
      - name: Set image version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish fork image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/igor04091968/tiredvpn:${{ github.ref_name }}
